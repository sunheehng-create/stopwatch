<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스탑워치</title>
<style>
  :root {
    --bg: #ffffff; --panel: rgba(244,242,247,.82); --panel-solid: #f4f2f7; --text: #1e1e1e; --muted: #6b6b73;
    --line: #dcd8e3; --purple: #7823dc; --purple-dark: #5a1aa6;
    --best: #7823dc; --worst: #8a8a93;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14111a; --panel: rgba(29,25,38,.82); --panel-solid: #1d1926; --text: #f3f1f7; --muted: #a29fae;
      --line: #342e42; --purple: #a566f5; --purple-dark: #8f45ee;
      --best: #c19bfa; --worst: #7d7a88;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "Helvetica Neue", Arial, "Malgun Gothic", sans-serif;
    display: flex; justify-content: center; padding: 56px 24px;
  }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .wrap { width: 100%; max-width: 560px; position: relative; z-index: 1; }

  header { border-top: 6px solid var(--purple); padding-top: 20px; margin-bottom: 40px; }
  .eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--purple); font-weight: 700; margin: 0 0 8px; }
  h1 { font-size: 28px; font-weight: 300; margin: 0; letter-spacing: -.01em; }

  .display-box { background: var(--panel); backdrop-filter: blur(6px); padding: 40px 24px 32px; margin-bottom: 2px; }
  .label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .display { font-variant-numeric: tabular-nums; font-size: clamp(44px, 14vw, 80px); font-weight: 300; letter-spacing: -2px; line-height: 1; }
  .display .ms { color: var(--purple); }

  .controls { display: grid; grid-template-columns: 1fr 2fr; gap: 2px; margin-bottom: 40px; }
  button {
    height: 56px; border: none; border-radius: 0; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    transition: background .15s, opacity .15s;
  }
  #lapBtn { background: var(--panel-solid); color: var(--text); }
  #lapBtn:hover:not(:disabled) { background: var(--line); }
  #startBtn { background: var(--purple); color: #fff; }
  #startBtn:hover { background: var(--purple-dark); }
  #startBtn.running { background: var(--text); color: var(--bg); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  .laps-head { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; border-bottom: 2px solid var(--text); }
  .laps { list-style: none; margin: 0; padding: 0; }
  .laps li { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: 16px; }
  .laps li span:first-child { color: var(--muted); }
  .laps li.best span:last-child { color: var(--best); font-weight: 700; }
  .laps li.worst span:last-child { color: var(--worst); text-decoration: line-through; text-decoration-thickness: 1px; }
  .laps li.current { font-weight: 600; }
  .laps li.current span:first-child { color: var(--purple); }

  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <p class="eyebrow">Time Tracker</p>
    <h1>스탑워치</h1>
  </header>

  <div class="display-box">
    <div class="label">Elapsed time</div>
    <div class="display" id="display">00:00<span class="ms">.00</span></div>
  </div>

  <div class="controls">
    <button id="lapBtn" disabled>랩</button>
    <button id="startBtn">시작</button>
  </div>

  <div class="laps-head"><span>Lap</span><span>Split</span></div>
  <ul class="laps" id="laps"></ul>

  <footer>Space 시작/정지 &nbsp;·&nbsp; L 랩 &nbsp;·&nbsp; R 초기화</footer>
</div>
<script>
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapsEl = document.getElementById('laps');

  let running = false, startTime = 0, elapsed = 0, lapStart = 0, laps = [], raf = null;

  function now() { return performance.now(); }
  function total() { return running ? elapsed + (now() - startTime) : elapsed; }

  function fmt(ms) {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    const p = n => String(n).padStart(2, '0');
    const main = (h ? h + ':' : '') + p(m) + ':' + p(s);
    return { main, cs: '.' + p(cs) };
  }

  function render() {
    const f = fmt(total());
    display.innerHTML = f.main + '<span class="ms">' + f.cs + '</span>';
    renderCurrentLap();
  }
  function tick() { render(); raf = requestAnimationFrame(tick); }

  function renderCurrentLap() {
    const first = lapsEl.querySelector('li.current');
    if (!first) return;
    const f = fmt(total() - lapStart);
    first.lastElementChild.textContent = f.main + f.cs;
  }

  function renderLaps() {
    lapsEl.innerHTML = '';
    if (!running && elapsed === 0) return;
    const cur = document.createElement('li');
    cur.className = 'current';
    cur.innerHTML = '<span>랩 ' + (laps.length + 1) + '</span><span></span>';
    lapsEl.appendChild(cur);
    let min = -1, max = -1;
    if (laps.length >= 2) { min = laps.indexOf(Math.min(...laps)); max = laps.indexOf(Math.max(...laps)); }
    for (let i = laps.length - 1; i >= 0; i--) {
      const li = document.createElement('li');
      if (i === min) li.className = 'best';
      if (i === max) li.className = 'worst';
      const f = fmt(laps[i]);
      li.innerHTML = '<span>랩 ' + (i + 1) + '</span><span>' + f.main + f.cs + '</span>';
      lapsEl.appendChild(li);
    }
    renderCurrentLap();
  }

  function toggle() {
    if (running) {
      elapsed += now() - startTime; running = false; cancelAnimationFrame(raf);
      startBtn.textContent = '시작'; startBtn.classList.remove('running'); lapBtn.textContent = '초기화';
    } else {
      startTime = now(); running = true;
      startBtn.textContent = '정지'; startBtn.classList.add('running');
      lapBtn.textContent = '랩'; lapBtn.disabled = false;
      if (!lapsEl.children.length) renderLaps();
      tick();
    }
    render();
  }
  function lapOrReset() {
    if (running) { const t = total(); laps.push(t - lapStart); lapStart = t; renderLaps(); }
    else reset();
  }
  function reset() {
    running = false; elapsed = 0; lapStart = 0; laps = [];
    cancelAnimationFrame(raf);
    startBtn.textContent = '시작'; startBtn.classList.remove('running');
    lapBtn.textContent = '랩'; lapBtn.disabled = true; lapsEl.innerHTML = '';
    render();
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', lapOrReset);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') { if (running) lapOrReset(); }
    else if (e.key === 'r' || e.key === 'R') { if (!running) reset(); }
  });

  /* ---------- 배경 애니메이션 ---------- */
  const cv = document.getElementById('bg'), cx = cv.getContext('2d');
  let W = 0, H = 0, phase = 0, speed = 0.15, alpha = 0.4, lastT = performance.now();
  function resize() {
    const d = devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener('resize', resize); resize();

  function bgFrame(t) {
    const dt = Math.min((t - lastT) / 1000, 0.1); lastT = t;
    speed += ((running ? 1 : 0.15) - speed) * Math.min(dt * 3, 1);
    alpha += ((running ? 1 : 0.4) - alpha) * Math.min(dt * 3, 1);
    phase += dt * speed;
    const purple = getComputedStyle(document.documentElement).getPropertyValue('--purple').trim() || '#7823dc';
    cx.clearRect(0, 0, W, H);
    for (let i = 0; i < 5; i++) {
      const base = H * (0.55 + i * 0.1), amp = 24 + i * 10, f = 0.004 - i * 0.0004;
      cx.beginPath(); cx.moveTo(0, H);
      for (let x = 0; x <= W; x += 8) cx.lineTo(x, base + Math.sin(x * f + phase * (1.2 + i * 0.35) + i) * amp);
      cx.lineTo(W, H); cx.closePath();
      cx.globalAlpha = (0.05 + i * 0.015) * alpha; cx.fillStyle = purple; cx.fill();
    }
    cx.globalAlpha = 1;
    requestAnimationFrame(bgFrame);
  }
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(bgFrame);
</script>
</body>
</html>
