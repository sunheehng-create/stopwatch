<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GP 스탑워치</title>
<style>
  :root {
    --red: #e10600; --purple: #b84dff; --green: #00d664; --yellow: #ffd400;
    --bg: #0b0b0f; --card: #15151b; --card2: #1d1d26; --line: #2c2c38; --text: #f4f4f7; --muted: #8d8da0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--text); background-color: var(--bg);
    background-image:
      linear-gradient(135deg, rgba(255,255,255,.03) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.03) 50%, rgba(255,255,255,.03) 75%, transparent 75%),
      radial-gradient(ellipse at 50% -10%, rgba(225,6,0,.22), transparent 60%);
    background-size: 6px 6px, 100% 100%;
    font-family: "Bahnschrift", "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    padding: 16px 14px 48px;
  }
  .app { width: min(100%, 920px); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* 상단 바 + 레이스 라이트 */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--card); border-radius: 10px; overflow: hidden; border-left: 8px solid var(--red); padding: 10px 16px; }
  .brand { font-weight: 800; font-style: italic; letter-spacing: .08em; font-size: clamp(14px, 3.4vw, 20px); text-transform: uppercase; }
  .brand b { color: var(--red); }
  .lights { display: flex; gap: clamp(6px, 1.6vw, 12px); background: #050507; padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line); }
  .lights i { width: clamp(14px, 3.2vw, 22px); aspect-ratio: 1; border-radius: 50%; background: #2a0b0b; box-shadow: inset 0 2px 3px rgba(0,0,0,.7); transition: background .08s, box-shadow .08s; }
  .lights i.on { background: #ff1a10; box-shadow: 0 0 14px 3px rgba(255,26,16,.85), inset 0 -2px 4px rgba(255,160,150,.6); }

  /* 씬 */
  .scene { position: relative; width: 100%; aspect-ratio: 16 / 7.2; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #10101a; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .car { position: absolute; left: 11%; bottom: 5%; width: 42%; pointer-events: none; }
  .car .shake { width: 100%; }
  .car svg { width: 100%; height: auto; display: block; overflow: visible; filter: drop-shadow(0 10px 8px rgba(0,0,0,.5)); }
  .car[data-state="run"] .shake { animation: shake .09s linear infinite alternate; }
  .car[data-state="rev"] .shake { animation: shakeR .05s linear infinite alternate; }
  @keyframes shake { from { transform: translateY(-1px); } to { transform: translateY(1.5px); } }
  @keyframes shakeR { from { transform: translate(-1px, 0); } to { transform: translate(1px, 1px); } }
  .car.hop .shake { animation: hop .5s cubic-bezier(.3,.7,.4,1) !important; }
  @keyframes hop { 0% { transform: none; } 35% { transform: translateY(-14px) rotate(-2deg); } 100% { transform: none; } }

  .w1 { transform-origin: 95px 104px; } .w2 { transform-origin: 335px 106px; }
  .car[data-state="run"] .wheel { animation: spin .2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .flame { display: none; transform-origin: 48px 80px; }
  .car[data-state="run"] .flame, .car[data-state="rev"] .flame { display: inline; animation: flick .08s linear infinite alternate; }
  .car[data-state="rev"] .flame { opacity: .6; }
  @keyframes flick { from { transform: scaleX(.55); } to { transform: scaleX(1.25); } }

  /* 애니 드라이버 */
  .tails { transform-origin: -16px -2px; }
  .car[data-state="idle"] .tails, .car[data-state="rest"] .tails { animation: tsway 2.6s ease-in-out infinite alternate; }
  .car[data-state="run"] .tails { animation: tfly .16s ease-in-out infinite alternate; }
  .car[data-state="rev"] .tails { animation: tfly .1s ease-in-out infinite alternate; }
  @keyframes tsway { from { transform: rotate(-3deg); } to { transform: rotate(4deg); } }
  @keyframes tfly { from { transform: rotate(-9deg) scaleX(1.08); } to { transform: rotate(7deg) scaleX(.92); } }
  .eyes { transform-origin: 8px 4px; animation: blink 4s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  .mo-run, .mo-rest { display: none; }
  .car[data-state="run"] .mo-idle, .car[data-state="rev"] .mo-idle { display: none; }
  .car[data-state="run"] .mo-run, .car[data-state="rev"] .mo-run { display: inline; }

  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.on { animation: flash .45s ease-out; }
  @keyframes flash { from { opacity: .55; } to { opacity: 0; } }
  .banner { position: absolute; left: 0; top: 14px; transform: translateX(-110%); background: var(--card); border-left: 6px solid var(--purple); padding: 8px 18px 8px 14px; font-weight: 800; font-style: italic; letter-spacing: .06em; font-size: clamp(13px, 2.6vw, 20px); border-radius: 0 8px 8px 0; box-shadow: 0 6px 20px rgba(0,0,0,.5); transition: transform .35s cubic-bezier(.2,.8,.2,1); white-space: nowrap; }
  .banner.show { transform: none; }
  .banner.best { border-left-color: var(--purple); color: #e6c4ff; }
  .banner.norm { border-left-color: var(--yellow); }
  .banner.good { border-left-color: var(--green); }
  .radio { position: absolute; right: 12px; top: 12px; display: flex; align-items: center; gap: 8px; max-width: 54%; background: rgba(10,10,14,.78); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: clamp(11px, 2.2vw, 14px); backdrop-filter: blur(6px); }
  .radio .tag { background: var(--red); color: #fff; font-weight: 800; font-size: .8em; letter-spacing: .1em; padding: 2px 6px; border-radius: 3px; }
  .radio.pop { animation: pop .3s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(.9); opacity: .4; } to { transform: none; opacity: 1; } }

  /* 타이밍 보드 */
  .board { display: grid; grid-template-columns: 1fr minmax(150px, 34%); gap: 14px; }
  @media (max-width: 560px) { .board { grid-template-columns: 1fr; } }
  .timebox, .mapbox { background: var(--card); border-radius: 12px; border: 1px solid var(--line); padding: 14px 18px; }
  .label { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .time { font-family: "Bahnschrift", "Cascadia Mono", Consolas, monospace; font-weight: 700; font-style: italic; font-variant-numeric: tabular-nums; font-size: clamp(40px, 11.5vw, 86px); line-height: 1.05; letter-spacing: -.02em; margin: 4px 0 8px; }
  .time .ms { font-size: .55em; color: var(--red); margin-left: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { background: var(--card2); border-radius: 6px; padding: 6px 10px; font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .chip small { color: var(--muted); font-weight: 700; letter-spacing: .12em; margin-right: 6px; font-size: 10px; }
  .chip.best b { color: var(--purple); }
  .sectors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .sectors div { height: 6px; background: var(--card2); border-radius: 3px; overflow: hidden; }
  .sectors div i { display: block; height: 100%; width: 0; background: var(--yellow); }
  .mapbox { display: flex; flex-direction: column; }
  .mapbox svg { width: 100%; height: auto; flex: 1; margin-top: 6px; }

  /* 컨트롤 */
  .controls { display: flex; gap: 12px; }
  .btn { flex: 1; border: none; cursor: pointer; font: inherit; font-weight: 800; font-style: italic; letter-spacing: .14em; text-transform: uppercase; font-size: 16px; height: 64px; color: var(--text); transform: skewX(-12deg); transition: filter .15s, transform .1s, opacity .2s; border-radius: 6px; }
  .btn span { display: inline-block; transform: skewX(12deg); }
  .btn:active:not(:disabled) { transform: skewX(-12deg) scale(.97); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn-start { flex: 2; background: var(--red); box-shadow: 0 8px 24px rgba(225,6,0,.45); }
  .btn-start:hover { filter: brightness(1.12); }
  .btn-start.running { background: #f4f4f7; color: #0b0b0f; box-shadow: none; }
  .btn-start.count { background: var(--yellow); color: #111; box-shadow: none; }
  .btn-lap { background: var(--card2); border: 1px solid var(--line); }
  .btn-lap:hover:not(:disabled) { filter: brightness(1.3); }
  .btn:disabled { opacity: .4; cursor: default; }

  /* 타이밍 타워 */
  .tower { background: var(--card); border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
  .tower-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .copy { font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  .copy:disabled { opacity: .4; cursor: default; }
  .copy:focus-visible { outline: 2px solid #fff; }
  .rows { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
  .rows:empty::after { content: "레이스가 시작되면 랩 타임이 여기에 기록돼요"; display: block; padding: 18px 16px; color: var(--muted); font-size: 14px; }
  .rows li { display: grid; grid-template-columns: 52px 1fr auto 84px; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; }
  .rows li:last-child { border-bottom: none; }
  .rows li.cur { background: linear-gradient(90deg, rgba(225,6,0,.18), transparent); border-left: 4px solid var(--red); padding-left: 12px; }
  .pos { display: inline-block; text-align: center; font-weight: 800; font-size: 12px; background: var(--card2); border-radius: 4px; padding: 3px 0; }
  .rows li.best .pos { background: var(--purple); color: #fff; }
  .lp { color: var(--muted); font-weight: 700; letter-spacing: .08em; font-size: 13px; }
  .gap { text-align: right; font-size: 13px; }
  .gap.p { color: var(--purple); } .gap.g { color: var(--green); } .gap.y { color: var(--yellow); }
  .rows li.best .tm { color: #e6c4ff; font-weight: 800; }
  .hint { text-align: center; font-size: 12px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .car *, .car .shake, .flash, .banner, .radio { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Grand Prix <b>Stopwatch</b></div>
    <div class="lights" id="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </header>

  <section class="scene" id="scene">
    <canvas id="cv" aria-hidden="true"></canvas>
    <div class="car" id="car" data-state="idle" aria-hidden="true"><div class="shake">
      <svg id="carSvg" viewBox="0 0 420 140" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hairG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9ad5"/><stop offset="1" stop-color="#8f7bff"/></linearGradient>
          <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2a1f"/><stop offset="1" stop-color="#a30500"/></linearGradient>
          <radialGradient id="irisG" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#7fe3ff"/><stop offset=".6" stop-color="#6a5cff"/><stop offset="1" stop-color="#2b1f7a"/></radialGradient>
        </defs>
        <!-- 배기 불꽃 -->
        <g class="flame"><polygon points="50,72 6,79 50,88" fill="#ff8a1f"/><polygon points="50,76 22,79 50,84" fill="#ffe27a"/></g>
        <!-- 리어 윙 -->
        <rect x="42" y="42" width="5" height="32" fill="#222"/><rect x="62" y="48" width="4" height="26" fill="#222"/>
        <rect x="16" y="30" width="58" height="9" rx="3" fill="#1b1b22"/><rect x="16" y="22" width="5" height="28" rx="2" fill="url(#bodyG)"/><rect x="69" y="22" width="5" height="28" rx="2" fill="url(#bodyG)"/>
        <!-- 드라이버 머리카락(차체 뒤) -->
        <g transform="translate(214 50)"><g class="tails">
          <path d="M-14 -8 C-40 -20 -72 -8 -100 -22 C-76 2 -48 10 -14 6Z" fill="url(#hairG)"/>
          <path d="M-14 0 C-38 6 -66 24 -92 22 C-68 10 -44 -2 -14 -4Z" fill="url(#hairG)" opacity=".85"/>
        </g></g>
        <!-- 차체 -->
        <path d="M44 100 L54 70 L128 64 L160 48 L192 48 L206 64 L268 72 L346 86 L396 94 L400 102 L44 102Z" fill="url(#bodyG)"/>
        <path d="M120 78 L270 86 L340 94 L120 94Z" fill="#7d0300" opacity=".55"/>
        <path d="M150 74 L300 84" stroke="#fff" stroke-width="3" opacity=".9"/>
        <rect x="232" y="84" width="40" height="13" rx="3" fill="#fff"/><text x="252" y="95" text-anchor="middle" font-family="Arial" font-weight="900" font-style="italic" font-size="13" fill="#e10600">27</text>
        <!-- 휠 -->
        <g class="wheel w1"><circle cx="95" cy="104" r="28" fill="#0f0f12"/><circle cx="95" cy="104" r="16" fill="#cfd3da"/><circle cx="95" cy="104" r="5" fill="#333"/><path d="M95 90 V118 M81 104 H109 M85 94 L105 114 M105 94 L85 114" stroke="#444" stroke-width="2"/></g>
        <g class="wheel w2"><circle cx="335" cy="106" r="25" fill="#0f0f12"/><circle cx="335" cy="106" r="14" fill="#cfd3da"/><circle cx="335" cy="106" r="4.5" fill="#333"/><path d="M335 93 V119 M322 106 H348 M326 97 L344 115 M344 97 L326 115" stroke="#444" stroke-width="2"/></g>
        <!-- 프런트 윙 -->
        <path d="M352 116 L412 116 L412 126 L346 126Z" fill="#1b1b22"/><rect x="404" y="98" width="5" height="30" rx="2" fill="url(#bodyG)"/>
        <!-- 드라이버 헬멧 -->
        <g transform="translate(214 50)">
          <circle r="23" fill="#f4f1f8"/>
          <path d="M-22 -7 Q0 -18 22 -7 L22 -1 Q0 -12 -22 -1Z" fill="#e10600"/>
          <ellipse cx="7" cy="5" rx="16" ry="14.5" fill="#ffe9dc"/>
          <g class="eyes">
            <ellipse cx="2" cy="4" rx="4.8" ry="6.4" fill="#2b1f7a"/><ellipse cx="2" cy="4" rx="4.1" ry="5.6" fill="url(#irisG)"/><circle cx="3.8" cy="1.6" r="1.9" fill="#fff"/><circle cx="0.6" cy="6.6" r=".9" fill="#fff"/>
            <ellipse cx="15" cy="4" rx="4.8" ry="6.4" fill="#2b1f7a"/><ellipse cx="15" cy="4" rx="4.1" ry="5.6" fill="url(#irisG)"/><circle cx="16.8" cy="1.6" r="1.9" fill="#fff"/><circle cx="13.6" cy="6.6" r=".9" fill="#fff"/>
          </g>
          <ellipse cx="-3" cy="11" rx="3.5" ry="2" fill="#ff8fb1" opacity=".6"/><ellipse cx="19" cy="11" rx="3.5" ry="2" fill="#ff8fb1" opacity=".6"/>
          <path class="mo-idle" d="M5 13 Q9 17 13 13" fill="none" stroke="#b8475f" stroke-width="1.8" stroke-linecap="round"/>
          <path class="mo-run" d="M4 12.5 Q9 11.5 14 12.5 Q13 19 9 19 Q5 19 4 12.5Z" fill="#b8475f"/>
          <path d="M-23 3 A23 23 0 0 0 -8 22" fill="none" stroke="#d9d4e2" stroke-width="3"/>
        </g>
        <!-- 콕핏 테두리 + 할로 -->
        <path d="M188 68 Q214 82 262 74 L262 82 Q214 90 188 76Z" fill="#14141a"/>
        <path d="M186 66 Q190 26 232 30 L268 70" fill="none" stroke="#25252d" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div></div>
    <div class="flash" id="flash"></div>
    <div class="banner" id="banner"></div>
    <div class="radio" id="radio"><span class="tag">RADIO</span><span id="radioTxt">준비됐어? 출발 버튼!</span></div>
  </section>

  <section class="board">
    <div class="timebox">
      <div class="label">Elapsed</div>
      <div class="time" id="display" role="timer" aria-live="off"><span id="tM">0:00</span><span class="ms" id="tMs">.000</span></div>
      <div class="chips">
        <div class="chip"><small>LAP</small><b id="lapNo">–</b></div>
        <div class="chip"><small>CURRENT</small><b id="lapNow">–</b></div>
        <div class="chip best"><small>BEST</small><b id="bestLap">–</b></div>
      </div>
      <div class="sectors" aria-hidden="true"><div><i id="s1"></i></div><div><i id="s2"></i></div><div><i id="s3"></i></div></div>
    </div>
    <div class="mapbox">
      <div class="label">Circuit · 30s</div>
      <svg viewBox="0 0 200 120" aria-hidden="true">
        <path id="track" d="M40 90 C18 90 12 64 34 52 L70 34 C92 24 104 40 94 54 C88 64 102 72 116 64 L148 42 C170 30 190 42 186 64 C182 88 152 100 122 96 L62 98 C50 98 46 94 40 90Z" fill="none" stroke="#2c2c38" stroke-width="12" stroke-linejoin="round"/>
        <path d="M40 90 C18 90 12 64 34 52 L70 34 C92 24 104 40 94 54 C88 64 102 72 116 64 L148 42 C170 30 190 42 186 64 C182 88 152 100 122 96 L62 98 C50 98 46 94 40 90Z" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1" stroke-dasharray="3 4"/>
        <g id="mapMarks"></g>
        <rect x="38" y="84" width="3" height="12" fill="#fff"/><rect x="38" y="84" width="3" height="4" fill="#111"/><rect x="38" y="92" width="3" height="4" fill="#111"/>
        <circle id="dot" r="5.5" fill="#e10600" stroke="#fff" stroke-width="2"/>
      </svg>
    </div>
  </section>

  <div class="controls">
    <button class="btn btn-lap" id="lapBtn" disabled><span>Lap</span></button>
    <button class="btn btn-start" id="startBtn"><span>Start</span></button>
  </div>

  <section class="tower">
    <div class="tower-top"><span class="label">Timing tower</span><button class="copy" id="copyBtn" disabled>기록 복사</button></div>
    <ul class="rows" id="rows"></ul>
  </section>
  <div class="hint">Space 출발/정지 · L 랩 · R 리셋 · 출발하면 레이스 라이트가 꺼진 뒤 시작해요</div>
  <div class="sr" id="announce" aria-live="polite"></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const startBtn = $('startBtn'), lapBtn = $('lapBtn'), copyBtn = $('copyBtn'), rowsEl = $('rows'), announce = $('announce');
  const carEl = $('car'), lightsEl = $('lights'), flashEl = $('flash'), bannerEl = $('banner'), radioEl = $('radio'), radioTxt = $('radioTxt');
  const tM = $('tM'), tMs = $('tMs'), lapNo = $('lapNo'), lapNowEl = $('lapNow'), bestEl = $('bestLap');
  const sec = [$('s1'), $('s2'), $('s3')];
  const dot = $('dot'), track = $('track'), mapMarks = $('mapMarks');
  const SVGNS = 'http://www.w3.org/2000/svg', LAP_MS = 30000;
  const trackLen = track.getTotalLength();

  let running = false, counting = false, startTime = 0, elapsed = 0, lapStart = 0, laps = [], marks = [], raf = null, countTimers = [];
  const KEY = 'stopwatch_v6_state';
  const total = () => running ? elapsed + (Date.now() - startTime) : elapsed;
  const p2 = n => String(n).padStart(2, '0'), p3 = n => String(n).padStart(3, '0');
  function fmt(ms) {
    const m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60, h = Math.floor(ms / 3600000);
    return { main: (h ? h + ':' + p2(m) : String(m)) + ':' + p2(s), ms: '.' + p3(Math.floor(ms) % 1000) };
  }
  const full = ms => { const f = fmt(ms); return f.main + f.ms; };

  function save() { try { localStorage.setItem(KEY, JSON.stringify({ running, startTime, elapsed, lapStart, laps, marks })); } catch (e) {} }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (!s) return;
      running = !!s.running; startTime = s.startTime || 0; elapsed = s.elapsed || 0; lapStart = s.lapStart || 0;
      laps = Array.isArray(s.laps) ? s.laps : []; marks = Array.isArray(s.marks) ? s.marks : [];
    } catch (e) {}
  }

  /* ---- 라디오 / 배너 / 상태 ---- */
  const cheers = ['페이스 좋아, 이대로!', '타이어 상태 굿!', '앞차 따라잡았어!', '집중, 집중!', '좋아, 계속 밟아~!', '리듬 유지해!'];
  let radioLock = 0, lastSec = -1, bannerTimer = null;
  function radio(text, hold) {
    radioTxt.textContent = text; radioEl.classList.remove('pop'); void radioEl.offsetWidth; radioEl.classList.add('pop');
    radioLock = hold ? performance.now() + hold : 0;
  }
  function banner(text, cls) {
    bannerEl.className = 'banner ' + (cls || ''); bannerEl.textContent = text; void bannerEl.offsetWidth; bannerEl.classList.add('show');
    clearTimeout(bannerTimer); bannerTimer = setTimeout(() => bannerEl.classList.remove('show'), 2200);
  }
  function setCar(s) { carEl.dataset.state = s; }
  function lights(n) { [...lightsEl.children].forEach((el, i) => el.classList.toggle('on', i < n)); }

  /* ---- 맵 ---- */
  function placeDot(t) {
    const f = (t / LAP_MS) % 1, p = track.getPointAtLength(trackLen * f);
    dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y);
    sec.forEach((el, i) => { el.style.width = Math.max(0, Math.min(1, f * 3 - i)) * 100 + '%'; });
  }
  function drawMarks() {
    mapMarks.innerHTML = '';
    marks.forEach(ms => {
      const p = track.getPointAtLength(trackLen * ((ms / LAP_MS) % 1));
      const c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 2.6); c.setAttribute('fill', '#ffd400'); mapMarks.appendChild(c);
    });
  }

  /* ---- 렌더 ---- */
  function bestIndex() { return laps.length ? laps.indexOf(Math.min(...laps)) : -1; }
  function render() {
    const t = total(), f = fmt(t);
    if (tM.textContent !== f.main) tM.textContent = f.main;
    tMs.textContent = f.ms;
    placeDot(t);
    const cur = t - lapStart;
    lapNowEl.textContent = (running || elapsed > 0) ? full(cur) : '–';
    const c = rowsEl.querySelector('li.cur .tm'); if (c) c.textContent = full(cur);
    const s = Math.floor(t / 1000);
    if (s !== lastSec) {
      lastSec = s; document.title = running ? f.main + ' · GP 스탑워치' : 'GP 스탑워치';
      if (running && s > 0 && s % 10 === 0 && performance.now() > radioLock) radio(cheers[(s / 10) % cheers.length]);
    }
  }
  function tick() { render(); raf = requestAnimationFrame(tick); }

  function renderRows() {
    rowsEl.innerHTML = '';
    if (running || elapsed > 0) {
      const li = document.createElement('li'); li.className = 'cur';
      li.innerHTML = '<span class="pos">LIVE</span><span class="lp">LAP ' + (laps.length + 1) + '</span><span class="tm"></span><span class="gap"></span>';
      rowsEl.appendChild(li);
    }
    const bi = bestIndex(), best = bi >= 0 ? laps[bi] : 0;
    const order = laps.map((v, i) => ({ v, i })).sort((a, b) => a.v - b.v || a.i - b.i), rank = {};
    order.forEach((o, r) => rank[o.i] = r + 1);
    for (let i = laps.length - 1; i >= 0; i--) {
      const li = document.createElement('li'); if (i === bi && laps.length > 1) li.className = 'best';
      const gap = laps[i] - best, faster = i > 0 && laps[i] < laps[i - 1];
      const cls = i === bi ? 'p' : faster ? 'g' : 'y';
      li.innerHTML = '<span class="pos">P' + rank[i] + '</span><span class="lp">LAP ' + (i + 1) + '</span><span class="tm">' + full(laps[i]) + '</span><span class="gap ' + cls + '">' + (i === bi ? 'BEST' : '+' + (gap / 1000).toFixed(3)) + '</span>';
      rowsEl.appendChild(li);
    }
    lapNo.textContent = (running || elapsed > 0) ? String(laps.length + 1) : '–';
    bestEl.textContent = bi >= 0 ? full(laps[bi]) : '–';
    copyBtn.disabled = laps.length === 0;
  }

  function applyUI() {
    startBtn.firstElementChild.textContent = counting ? 'Cancel' : running ? 'Stop' : (elapsed > 0 ? 'Resume' : 'Start');
    startBtn.classList.toggle('running', running && !counting); startBtn.classList.toggle('count', counting);
    lapBtn.firstElementChild.textContent = running || elapsed === 0 ? 'Lap' : 'Reset';
    lapBtn.disabled = (!running && elapsed === 0) || counting;
    setCar(counting ? 'rev' : running ? 'run' : elapsed > 0 ? 'rest' : 'idle');
    renderRows(); drawMarks(); lastSec = -1; render();
  }

  /* ---- 동작 ---- */
  function beginRun() {
    counting = false; lights(0); startTime = Date.now(); running = true; tick();
    radio('라이트 아웃! 출발~!!', 1800); banner('LIGHTS OUT — GO GO GO', 'good');
    announce.textContent = '라이트 아웃, 출발'; applyUI(); save();
  }
  function startCountdown() {
    counting = true; applyUI(); radio('엔진 예열 중… 라이트 온!', 0);
    let n = 0;
    const step = () => { n++; lights(n); if (n < 5) countTimers.push(setTimeout(step, 280)); else countTimers.push(setTimeout(beginRun, 520)); };
    countTimers.push(setTimeout(step, 250));
  }
  function cancelCountdown() { countTimers.forEach(clearTimeout); countTimers = []; counting = false; lights(0); radio('스타트 취소!', 1500); applyUI(); }
  function toggle() {
    if (counting) return cancelCountdown();
    if (running) { elapsed += Date.now() - startTime; running = false; cancelAnimationFrame(raf); radio('피트인~! 잠깐 쉬어가자', 0); applyUI(); save(); }
    else if (elapsed === 0) startCountdown();
    else { startTime = Date.now(); running = true; tick(); radio('다시 출발!!', 1500); applyUI(); save(); }
  }
  function lapOrReset() {
    if (counting) return;
    if (running) {
      const t = total(), lt = t - lapStart, prevBest = laps.length ? Math.min(...laps) : Infinity;
      laps.push(lt); marks.push(t); lapStart = t;
      const isBest = laps.length > 1 && lt < prevBest, faster = laps.length > 1 && lt < laps[laps.length - 2];
      renderRows(); drawMarks();
      flashEl.classList.remove('on'); void flashEl.offsetWidth; flashEl.classList.add('on');
      carEl.classList.remove('hop'); void carEl.offsetWidth; carEl.classList.add('hop'); setTimeout(() => carEl.classList.remove('hop'), 550);
      banner('LAP ' + laps.length + '  ' + full(lt) + (isBest ? '  · FASTEST' : ''), isBest ? 'best' : faster ? 'good' : 'norm');
      radio(isBest ? '퍼플 랩! 최고 기록이야!' : '랩 ' + laps.length + ' 통과!', 1800);
      announce.textContent = '랩 ' + laps.length + ' ' + full(lt); save();
    } else if (elapsed > 0) reset();
  }
  function reset() {
    running = false; elapsed = 0; lapStart = 0; laps = []; marks = []; cancelAnimationFrame(raf);
    radio('준비됐어? 출발 버튼!', 0); applyUI(); save();
  }
  copyBtn.addEventListener('click', async () => {
    const text = laps.map((l, i) => 'LAP ' + (i + 1) + '\t' + full(l)).join('\n');
    try { await navigator.clipboard.writeText(text); copyBtn.textContent = '복사됨 ✓'; } catch (e) { copyBtn.textContent = '복사 실패'; }
    setTimeout(() => copyBtn.textContent = '기록 복사', 1400);
  });
  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', lapOrReset);
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) toggle(); }
    else if (e.key === 'l' || e.key === 'L') { if (running) lapOrReset(); }
    else if (e.key === 'r' || e.key === 'R') { if (!running && !counting && elapsed > 0) reset(); }
  });
  document.addEventListener('keyup', e => { if (e.code === 'Space') e.preventDefault(); });
  addEventListener('beforeunload', save);

  /* ---------- 씬 (캔버스) ---------- */
  const cv = $('cv'), cx = cv.getContext('2d'), scene = $('scene');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, speed = 0, lastT = performance.now(), acc = 0;
  let oHill = 0, oStand = 0, oBar = 0, oCurb = 0, oDash = 0, sparkX = 0, sparkY = 0;
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const crowd = Array.from({ length: 220 }, () => ({ x: rnd() * 640, y: rnd(), c: ['#ff6b6b', '#ffd166', '#6bc5ff', '#fff', '#c792ff', '#7dffb0'][Math.floor(rnd() * 6)] }));
  const streaks = Array.from({ length: 16 }, () => ({ x: Math.random(), y: Math.random(), l: 60 + Math.random() * 160, m: .6 + Math.random() }));
  const sparks = [], ads = [['#e10600', 'SPEED'], ['#f4f4f7', 'TURBO'], ['#111116', 'GP'], ['#ffd400', 'RACE'], ['#1f6bff', 'NITRO'], ['#f4f4f7', 'DRIFT']];

  function resize() {
    const d = devicePixelRatio || 1; W = scene.clientWidth; H = scene.clientHeight;
    cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
    const cr = carEl.getBoundingClientRect(), sr = scene.getBoundingClientRect();
    sparkX = cr.left - sr.left + cr.width * .22; sparkY = cr.bottom - sr.top - cr.height * .06;
    draw(0.016);
  }
  new ResizeObserver(resize).observe(scene);

  function draw(dt) {
    const target = (running || counting) ? 1 : 0;
    speed += ((running ? 1 : counting ? 0 : 0) - speed) * Math.min(dt * 2.5, 1);
    const v = speed * 1100;
    oHill += dt * v * .05; oStand += dt * v * .28; oBar += dt * v * .85; oCurb += dt * v; oDash += dt * v;
    const hz = H * .5;
    // 하늘
    const sg = cx.createLinearGradient(0, 0, 0, hz); sg.addColorStop(0, '#080c26'); sg.addColorStop(.6, '#4a2a6e'); sg.addColorStop(1, '#ff8a5c');
    cx.fillStyle = sg; cx.fillRect(0, 0, W, H);
    const rg = cx.createRadialGradient(W * .8, hz, 0, W * .8, hz, H * .6); rg.addColorStop(0, 'rgba(255,214,140,.7)'); rg.addColorStop(1, 'rgba(255,214,140,0)');
    cx.fillStyle = rg; cx.fillRect(0, 0, W, hz + 10);
    // 언덕
    cx.fillStyle = '#26183f'; cx.beginPath(); cx.moveTo(0, hz);
    for (let x = 0; x <= W; x += 8) cx.lineTo(x, hz - 34 - 22 * Math.sin((x + oHill) / 110) - 12 * Math.sin((x + oHill) / 41)); cx.lineTo(W, hz); cx.fill();
    // 관중석
    const sT = H * .27, sB = H * .5;
    cx.fillStyle = '#17142a'; cx.fillRect(0, sT, W, sB - sT);
    cx.fillStyle = '#221d3c'; cx.fillRect(0, sT, W, 5);
    const so = oStand % 640;
    for (let k = -1; k * 640 - so < W; k++) for (const c of crowd) {
      const x = c.x + k * 640 - so; if (x < -4 || x > W) continue;
      cx.fillStyle = c.c; cx.globalAlpha = .75; cx.fillRect(x, sT + 10 + c.y * (sB - sT - 18), 3, 3);
    }
    cx.globalAlpha = 1;
    // 광고 보드
    const bT = H * .5, bB = H * .6, pw = Math.max(110, W * .13), bo = oBar % (pw * ads.length);
    for (let k = -1; k * pw * ads.length - bo < W; k++) ads.forEach((a, i) => {
      const x = k * pw * ads.length + i * pw - bo; if (x + pw < 0 || x > W) return;
      cx.fillStyle = a[0]; cx.fillRect(x, bT, pw - 2, bB - bT);
      cx.fillStyle = (a[0] === '#f4f4f7' || a[0] === '#ffd400') ? '#111' : '#fff'; cx.font = 'italic 800 ' + Math.round((bB - bT) * .55) + 'px Bahnschrift, Arial'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.fillText(a[1], x + pw / 2, (bT + bB) / 2 + 1);
    });
    // 연석
    const cT = H * .6, cB = H * .645, cw = 38, co = oCurb % (cw * 2);
    for (let x = -co - cw * 2; x < W; x += cw) { const idx = Math.round((x + co) / cw); cx.fillStyle = idx % 2 ? '#fff' : '#e10600'; cx.fillRect(x, cT, cw, cB - cT); }
    // 아스팔트
    const ag = cx.createLinearGradient(0, cB, 0, H); ag.addColorStop(0, '#34343c'); ag.addColorStop(1, '#16161b');
    cx.fillStyle = ag; cx.fillRect(0, cB, W, H - cB);
    cx.fillStyle = 'rgba(255,255,255,.55)'; const dl = 90, dg = 70, dd = oDash % (dl + dg), dy = H * .94;
    for (let x = -dd; x < W; x += dl + dg) cx.fillRect(x, dy, dl, 4);
    // 속도선
    cx.strokeStyle = 'rgba(255,255,255,' + (.18 * speed) + ')'; cx.lineWidth = 2;
    for (const s of streaks) {
      s.x -= dt * (v * s.m) / W * 1.2; if (s.x < -.3) { s.x = 1.1; s.y = Math.random(); }
      if (speed < .02) continue; const y = cB + s.y * (H - cB), x = s.x * W; cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x + s.l * speed, y); cx.stroke();
    }
    // 스파크
    if (speed > .3 && running) for (let i = 0; i < 2; i++) if (Math.random() < .6) sparks.push({ x: sparkX, y: sparkY, vx: -200 - Math.random() * 300, vy: -60 - Math.random() * 160, l: .5 + Math.random() * .3 });
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.l -= dt; if (p.l <= 0) { sparks.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 620 * dt;
      cx.fillStyle = 'rgba(255,' + (150 + Math.random() * 90 | 0) + ',40,' + Math.min(1, p.l * 2) + ')'; cx.fillRect(p.x, p.y, 3, 3);
    }
    // 비네트
    const vg = cx.createLinearGradient(0, 0, W, 0); vg.addColorStop(0, 'rgba(0,0,0,.35)'); vg.addColorStop(.2, 'rgba(0,0,0,0)'); vg.addColorStop(.85, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.35)');
    cx.fillStyle = vg; cx.fillRect(0, 0, W, H);
  }
  function loop(now) {
    const dt = Math.min((now - lastT) / 1000, .1); lastT = now; acc += dt;
    if (running || speed > .01 || sparks.length || acc > 1 / 15) { draw(acc); acc = 0; }
    requestAnimationFrame(loop);
  }

  load(); counting = false; applyUI(); if (running) tick(); resize();
  if (!reduced) requestAnimationFrame(loop);
</script>
</body>
</html>
